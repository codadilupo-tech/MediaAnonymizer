[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui", "crates/mobile"]
# `cargo build` without `-p` builds the library and the CLI; the GUI is opt-in
# because it pulls in a windowing stack, and the mobile bridge is built by the
# Flutter app (mobile/).
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
authors = ["MediaAnonymizer contributors"]

[workspace.dependencies]
mediaanon-core = { path = "crates/core", version = "0.1.0", default-features = false }

ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-22"] }
mozjpeg-sys = { version = "2.2", default-features = false, features = ["parallel", "unwinding"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp"] }
libc = "0.2"
crc32fast = "1.4"
rayon = "1.10"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = "1.16"
ab_glyph = "0.2.32"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
indicatif = "0.18"
walkdir = "2.5"
ctrlc = { version = "3.4", features = ["termination"] }
assert_cmd = "2"
tempfile = "3"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence", "accesskit"] }
winresource = "0.1.34"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Pixel kernels are hot even while developing; keep them reasonably fast in debug builds.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.mediaanon-core]
opt-level = 2
